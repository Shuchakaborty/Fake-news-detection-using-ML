
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detector</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 500px;
      max-width: 90%;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 28px;
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      resize: none;
      outline: none;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      border-color: #5563DE;
    }

    button {
      margin-top: 20px;
      padding: 12px 35px;
      background: #5563DE;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #3742fa;
      transform: scale(1.05);
    }

    .result {
      font-size: 22px;
      margin-top: 25px;
      padding: 10px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .result.true {
      background-color: #2ecc71; /* Green for real news */
    }

    .result.fake {
      background-color: #e74c3c; /* Red for fake news */
    }

    footer {
      margin-top: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📰 Fake News Detection</h1>
    <form method="post" id="newsForm">
      <textarea id="newsText" name="news_text" placeholder="Paste news text here..."></textarea><br>
      <button type="submit">Check</button>
    </form>

    {% if prediction %}
      <div id="resultBox" class="result {% if prediction == 'Real' %}true{% else %}fake{% endif %}">
        Prediction: <strong>{{ prediction }}</strong>
      </div>
    {% endif %}
  </div>

  <script>
    // Hide previous prediction when user types new text
    const textArea = document.getElementById("newsText");
    const resultBox = document.getElementById("resultBox");

    if (textArea && resultBox) {
      textArea.addEventListener("input", () => {
        resultBox.style.display = "none";
      });
    }
  </script>
</body>
</html>
