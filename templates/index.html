
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detector</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 400px;
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      color: #4b0082;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 150px;
      border: 2px solid #6e8efb;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      resize: none;
      outline: none;
      transition: all 0.3s ease;
    }

    textarea:focus {
      border-color: #a777e3;
      box-shadow: 0 0 10px rgba(166, 119, 227, 0.4);
    }

    button {
      margin-top: 20px;
      background-color: #6e8efb;
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #a777e3;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    .real {
      color: green;
    }

    .fake {
      color: red;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📰 Fake News Detection</h1>
    <form method="POST">
      <textarea name="news_text" placeholder="Paste news text here..." required></textarea><br>
      <button type="submit">Check</button>
    </form>

    {% if prediction %}
      <div class="result">
        {% if prediction == "REAL" %}
          <p class="real">✅ The news is REAL</p>
        {% elif prediction == "FAKE" %}
          <p class="fake">❌ The news is FAKE</p>
        {% else %}
          <p>{{ prediction }}</p>
        {% endif %}
      </div>
    {% endif %}
  </div>
</body>
</html>
